<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Capriola&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Glegoo:wght@400;700&family=Karla:ital,wght@0,200..800;1,200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Calculadora</title>
</head>
<body>
    <div class="calculadora">
        <div id="display" class="consola"></div>
        <div class="botones">
            <button class="boton boton-number">7</button>
            <button class="boton boton-number">8</button>
            <button class="boton boton-number">9</button>
            <button class="boton boton-operacion">÷</button>
            <button class="boton boton-number">4</button>
            <button class="boton boton-number">5</button>
            <button class="boton boton-number">6</button>
            <button class="boton boton-operacion">x</button>
            <button class="boton boton-number">1</button>
            <button class="boton boton-number">2</button>
            <button class="boton boton-number">3</button>
            <button class="boton boton-operacion">-</button>
            <button id="boton-limpiar" class="boton boton-C">C</button>
            <button class="boton boton-number">0</button>
            <button id="boton-igual" class="boton boton-igual">=</button>
            <button class="boton boton-operacion">+</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
